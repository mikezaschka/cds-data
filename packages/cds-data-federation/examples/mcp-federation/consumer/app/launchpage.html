<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP + cds-data-federation — Demo</title>

    <script>
        window['sap-ushell-config'] = {
            defaultRenderer: 'fiori2',
            renderers: {
                fiori2: {
                    componentData: {
                        config: {
                            search: 'hidden'
                        }
                    }
                }
            },
            applications: {
                // ─── Admin ──────────────────────────────────────────────────
                'pipeline-console-app': {
                    title: 'Pipeline Console',
                    subTitle: 'Admin',
                    description: 'Pipelines & runs — status, errors, data inspection (ReplicatedCustomers)',
                    applicationType: 'URL',
                    url: '/pipeline-console/',
                    navigationMode: 'newWindow'
                },
                // ─── Compare: same data via OData ───────────────────────────
                'federation-odata-app': {
                    title: 'Federation OData',
                    subTitle: 'Compare',
                    description: 'Delegated + replicated entities via OData V4',
                    applicationType: 'URL',
                    url: '/odata/v4/federation-agent/Customers',
                    navigationMode: 'newWindow'
                }
            }
        };
    </script>

    <script src="https://ui5.sap.com/test-resources/sap/ushell/bootstrap/sandbox.js"></script>
    <script
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m, sap.ushell"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-frameOptions="allow"
        data-sap-ui-bindingSyntax="complex"
        data-sap-ui-async="true"></script>
    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ushell.Container.createRenderer().placeAt('content');
        });
    </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
