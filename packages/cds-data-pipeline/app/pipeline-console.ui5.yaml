specVersion: "3.0"
metadata:
  name: pipeline.monitor.fcl
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.suite.ui.commons
    - name: themelib_sap_horizon
resources:
  configuration:
    paths:
      webapp: webapp
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transformTypeScript: true
        omitTSFromBuildResult: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript: true
    - name: ui5-middleware-cap
      afterMiddleware: compression
      configuration:
        moduleId: cds-data-pipeline
