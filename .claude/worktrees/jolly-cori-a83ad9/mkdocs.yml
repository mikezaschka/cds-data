site_name: cds-data-federation
site_description: A SAP CAP plugin for data federation — delegation, replication, and caching via declarative CDS annotations.
site_url: https://mikezaschka.github.io/cds-data-federation/
repo_url: https://github.com/mikezaschka/cds-data-federation
repo_name: mikezaschka/cds-data-federation
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - First Delegation: getting-started/first-delegation.md
      - First Replication: getting-started/first-replication.md
      - First Cache: getting-started/first-cache.md
      - Patterns:
          - Joining Local with Remote: getting-started/joining-local-with-remote.md
          - Extending Remote with Local: getting-started/extending-remote-with-local.md
          - Cross-Provider Mashup: getting-started/cross-provider-mashup.md
          - Mixing Delegate and Replicate: getting-started/mixing-delegate-and-replicate.md
          - Local Analytics over Replicated Data: getting-started/local-analytics-over-replicated.md
  - Concepts:
      - Terminology: concepts/terminology.md
      - Consumption Views: concepts/consumption-views.md
      - $expand Scenarios: concepts/expand-scenarios.md
      - Service Query Execution: concepts/service-query-execution.md
  - Reference:
      - Annotations: reference/annotations.md
      - Management Service: reference/management-service.md
      - Comparison with CAP built-ins: reference/comparison.md
      - Feature Matrix: reference/requirements.md
  - Integration:
      - OData V2 / V4: integration/odata.md
      - REST Adapter: integration/rest.md
      - cds-caching: integration/caching.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - awesome-pages

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mikezaschka/cds-data-federation
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/cds-data-federation
