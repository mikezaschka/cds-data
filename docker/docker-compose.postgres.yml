# Postgres backing store for optional cds-data-pipeline smoke tests.
# Usage:
#   docker compose -f docker/docker-compose.postgres.yml up -d
#   npm run test:integration:postgres -w cds-data-pipeline
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cds_data_pipeline_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cds_data_pipeline_test']
      interval: 5s
      timeout: 5s
      retries: 10
